plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

// Load release signing config from keystore.properties if present (gitignored).
// Falls back to debug signing so unconfigured machines can still build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = keystoreProperties.getProperty('storeFile') != null

android {
    namespace 'dev.statup.app'
    compileSdk 36

    defaultConfig {
        applicationId "dev.statup.app"
        minSdk 26
        // Play requires targetSdk 36 for new app updates from Aug 31, 2026. Bumped from 35
        // on 2026-06-10: no edge-to-edge opt-outs, no orientation locks, no custom back
        // handling in this app, so the API-36 behavior changes are no-ops here.
        targetSdk 36
        // versionCode 13 shipped as v3.1.5. Play requires a strictly higher code per upload.
        versionCode 14
        versionName "3.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }

        // Room schema export
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Expose the exported Room schemas to instrumented tests so MigrationTest can validate
    // every migration path (catches a forgotten migration before it ships and wipes data).
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    // Freeze the existing lint backlog into a baseline so CI's lintDebug is deterministic:
    // only NEW issues fail the build. Regenerate by deleting lint-baseline.xml and re-running
    // ./gradlew lintDebug. Warnings are not promoted to errors; the baseline captures them.
    //
    // Deliberately NOT baselined: GradleDependency / NewerVersionAvailable /
    // AndroidGradlePluginVersion. Core App Quality's SDK_Maintenance criterion asks that
    // dependencies stay current, so those must stay visible in every CI run instead of being
    // silently frozen. They surface as warnings (warningsAsErrors = false), so they inform
    // without breaking the build. If you regenerate the baseline, strip those ids again.
    lint {
        baseline = file("lint-baseline.xml")
        warningsAsErrors false
        abortOnError true
    }
}

// Google Play's User Data policy requires the privacy policy to be reachable from INSIDE the
// app, not just from the store listing. PRIVACY_POLICY.md at the repo root is the single
// source of truth; this task copies it into assets so PrivacyPolicyScreen can render it
// offline. The asset is generated (gitignored) - never edit it by hand.
def privacyPolicySource = rootProject.file("PRIVACY_POLICY.md")
def privacyPolicyAssetDir = file("src/main/assets")

tasks.register('syncPrivacyPolicy') {
    description = 'Copies PRIVACY_POLICY.md into assets so the app can render it offline.'
    inputs.file(privacyPolicySource)
    outputs.file(new File(privacyPolicyAssetDir, 'privacy_policy.md'))
    doLast {
        // Drop the maintainer note - it is repo guidance, not something a user should read
        // in the app. Everything outside the DEV-NOTE markers ships verbatim.
        def shipped = new StringBuilder()
        def skipping = false
        privacyPolicySource.eachLine { line ->
            if (line.contains('<!--DEV-NOTE-START-->')) { skipping = true; return }
            if (line.contains('<!--DEV-NOTE-END-->')) { skipping = false; return }
            if (!skipping) shipped.append(line).append('\n')
        }
        privacyPolicyAssetDir.mkdirs()
        new File(privacyPolicyAssetDir, 'privacy_policy.md').text =
            shipped.toString().replaceAll('\n{3,}', '\n\n')
    }
}

tasks.named('preBuild') { dependsOn('syncPrivacyPolicy') }

// Loud guard: a release build with no keystore.properties is signed with the SHARED Android
// debug key. Such an artifact must never be published/distributed - and once users install a
// build signed with one key, every later update must use the SAME key or Android refuses to
// update (forcing an uninstall + data loss). Warn only when a release task is actually run.
if (!hasReleaseKeystore) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.path.toLowerCase().contains("release") }) {
            logger.warn(
                "\n⚠️  Stat Up: RELEASE build is using the DEBUG keystore (no keystore.properties).\n" +
                "    Do NOT publish or share this APK/AAB. Create keystore.properties from\n" +
                "    keystore.properties.template with your own upload key, and keep that key\n" +
                "    forever - switching keys later forces users to uninstall to update.\n"
            )
        }
    }
}

dependencies {
    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2025.03.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Compose
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Core Android
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.9.0'

    // Room
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.4'

    // Encrypted storage for API tokens. NOTE: 1.1.0 stable deprecates the whole
    // EncryptedSharedPreferences/MasterKey API (Jetpack Security crypto is in maintenance
    // mode). It still works and the on-disk format is unchanged from the alphas; moving off
    // it would need a data-migration plan for the existing secret_prefs file.
    implementation 'androidx.security:security-crypto:1.1.0'

    // Backdrop blur (glass effect on cards + bottom bar).
    // Real GPU blur on API 31+; auto-falls-back to a translucent scrim on older devices.
    implementation 'dev.chrisbanes.haze:haze:1.7.2'
    implementation 'dev.chrisbanes.haze:haze-materials:1.7.2'

    // Markdown rendering for AI chat bubbles. Backed by Markwon (View-interop), so it does
    // not bring its own Compose UI version and is safe with Compose BOM 2025.03.01.
    // Published on JitPack - see settings.gradle for the repo entry.
    implementation 'com.github.jeziellago:compose-markdown:0.7.2'

    // Koin DI
    implementation 'io.insert-koin:koin-android:3.5.6'
    implementation 'io.insert-koin:koin-androidx-compose:3.5.6'

    // Ktor Client
    implementation 'io.ktor:ktor-client-core:3.1.2'
    implementation 'io.ktor:ktor-client-android:3.1.2'
    implementation 'io.ktor:ktor-client-content-negotiation:3.1.2'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.1.2'

    // Kotlinx Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'

    // WorkManager for background sync
    implementation 'androidx.work:work-runtime-ktx:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // Coroutine/Flow unit-test support (runTest, TestDispatcher, Dispatchers.setMain).
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    // Validates every Room migration path against the exported schemas so a forgotten
    // migration (which would wipe user data on update) is caught before shipping.
    androidTestImplementation 'androidx.room:room-testing:2.7.1'
}
